[package]
name        = "quiz-bot"
version     = "0.1.0"
edition     = "2021"

[[bin]]
name = "quiz-bot"
path = "src/main.rs"

[dependencies]
anyhow             = "1"
base64             = "0.22"
chrono             = { version = "0.4", features = ["serde"] }
chrono-tz          = "0.9"
flate2             = "1"
mxbot-common       = { git = "https://github.com/PolynomialDivision/mxbot-common" }
rand               = "0.8"
mime               = "0.3"
reqwest            = { version = "0.13", features = ["json"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
rusqlite           = { version = "0.40", features = ["chrono", "serde_json"] }
tar                = "0.4"
tokio              = { version = "1", features = ["full"] }
tracing            = "0.1"

[dev-dependencies]
toml        = "0.8"
wiremock    = "0.6"
mxbot-common = { git = "https://github.com/PolynomialDivision/mxbot-common", features = ["testing"] }
tokio       = { version = "1", features = ["test-util"] }
