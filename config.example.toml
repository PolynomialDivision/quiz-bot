[matrix]
homeserver    = "https://matrix.example.org"
user_id       = "@quizbot:example.org"
# Secrets may instead come from MATRIX_ACCESS_TOKEN / MATRIX_RECOVERY_KEY.
access_token  = "syt_REPLACE_ME"
device_id     = "REPLACE_ME"
# recovery_key = "OPTIONAL RECOVERY KEY"

[security]
# Users allowed to invite the bot ("all" = anyone, [] = nobody).
# Configured admins may always open a direct chat with the bot.
allowed_inviters = ["@admin:example.org"]
# Only these users may run admin commands, also privately in a direct chat
# with the bot (!startquiz, !prefetch).
admin_users = ["@admin:example.org"]
# encryption_strategy = "identity_based"  # AllDevices | IdentityBased (default) | OnlyTrusted

[schedule]
# Matrix room where all quiz messages and bot replies are posted.
room_id = "!REPLACE_ME:example.org"

# Times to post the daily quiz (HH:MM, in the configured timezone).
# Add multiple entries to run more than one quiz per day.
quiz_times = ["18:00"]
# quiz_times = ["12:00", "18:00", "21:30"]

# How many questions per quiz round (default 5).
questions_per_round = 5

# How long (seconds) to collect reactions per question.
answer_timeout_secs = 60

# Pause in seconds between questions (default 10).
inter_question_secs = 10

# Reminders before the quiz: a list of seconds, each triggering a "starting
# soon" message.  The scheduler wakes at the largest value; each reminder fires
# in order with the appropriate gap between them.
# Use a single value [300] for one reminder, or [300, 60] for two.
# Set to [] or omit to disable.  Default: [300] (5 minutes).
reminder_before_secs = [300, 60]

# IANA timezone for quiz scheduling.
timezone = "Europe/Berlin"

[trivia]
# Questions are fetched automatically from https://opentdb.com/ — no manual
# setup needed.  The bot pre-caches batches of questions and uses a session
# token to avoid repeats until the full pool is exhausted.

# Optional: restrict to a specific category.
# See https://opentdb.com/api_category.php for IDs.
# category = 9    # General Knowledge
# category = 18   # Science: Computers

# Optional: restrict difficulty.  One of: easy, medium, hard.
# difficulty = "medium"

# How many questions to fetch per API call (1–50, default 10).
batch_size = 10

# Category groups to exclude entirely (optional).
# excluded_categories = ["Sports", "Celebrities"]

# Avoid groups used by this many recently asked questions. This is a preference,
# so configurations with only a few active categories still work.
recent_category_window = 5

# Data is stored in SQLite at $STORE_PATH/quiz.db — no separate database
# process or configuration required.

[trivia.triviaqa]
# Optional secondary question source: real TriviaQA questions/answers. The
# LLM ([explainer] api_key/model) checks each question is suitable (drops
# time-bound or ambiguous ones), files it into one of the categories above,
# rates its difficulty and writes 3 wrong answers — in the background, in
# batches, so rounds never wait for it.
# `enabled` is only the default: admins switch the source at runtime with
#   !admin set question_source mixed|opentdb|triviaqa
#   !admin set triviaqa_share 0.5
# test one round with !startquiz triviaqa, and inspect/curate with !triviaqa.
enabled = false

# Where to download the TriviaQA dataset from on first use (downloaded once
# and cached in the database — not re-downloaded on later restarts). Point
# this straight at the official release's .tar.gz — the bot reads it
# natively (picks the *-dev.json split out of the archive).
# dataset_url = "https://nlp.cs.washington.edu/triviaqa/data/triviaqa-unfiltered.tar.gz"

# Cap on how many QA pairs to ingest from the dataset (default 20000).
# max_pool_size = 20000

# Default share of TriviaQA questions in `mixed` mode (0.0-1.0, default 0.3).
# mix_ratio = 0.3

[explainer]
# Groq API key: enables explanations after each question and TriviaQA.
# api_key = "gsk_..."
# Model id exactly as listed on https://console.groq.com/docs/models
# (default llama-3.3-70b-versatile; e.g. "openai/gpt-oss-120b").
# model = "llama-3.3-70b-versatile"

[security.verification]
# Users allowed to complete first-time verification. If omitted or empty,
# an explicit allowed_inviters list is used as the fallback.
allowed_users = ["@you:matrix.org"]
# Also allow first-time verification for users sharing a joined room with the bot.
allow_users_from_joined_rooms = false
# SAS-only verification limits.
flow_timeout_secs = 300
grant_ttl_secs = 600
max_concurrent = 8

[security.admin_dm]
# Admins can open a direct chat with the bot and manage it there:
#   !admin status | verify | settings | set <key> <value> | unset <key>
# `!admin verify` starts mutual emoji (SAS) verification with you.
enabled = true
# Only accept admin commands in end-to-end encrypted direct chats.
require_encryption = true
# Only accept admin commands from devices the bot has verified (recommended
# once you and the bot have verified each other).
require_verified_device = false
